# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI and SonarQube Analysis

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Create config.ini file
      shell: bash
      run: |
        cat << EOF > config.ini
        [paths]
        movies_folder = Films
        tv_shows_folder = Séries
        not_sorted_media_files_folder = .download

        [api]
        gemini_api_key = ${{ secrets.GEMINI_API_KEY }}
        tmdb_api_key = ${{ secrets.TMDB_API_KEY }}
        groq_api_key = ${{ secrets.GROQ_API_KEY }}
        openrouter_api_key = ${{ secrets.OPENROUTER_API_KEY }}
        cloudflare_api_token = ${{ secrets.CLOUDFLARE_API_TOKEN }}
        cloudflare_account_id = ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        [mail]
        mail = ${{ secrets.MAIL }}
        mail_pswd = ${{ secrets.MAIL_PSWD }}

        [options]
        resolution = true
        quality = true
        EOF

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Code Quality (Ruff)
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/

    - name: Run Tests and Generate Coverage
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          if ! command -v xvfb-run &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          xvfb-run -a pytest --cov=src --cov-report=xml
        else
          pytest --cov=src --cov-report=xml
        fi

    # upload coverage file when os is ubuntu / linux
    - name: Upload coverage artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        include-hidden-files: true
        retention-days: 1

    - name: Build Standalone Executable (PyInstaller)
      run: |
        pyinstaller media-organizer.spec --noconfirm

    - name: Test Standalone Executable on ${{ matrix.os }}
      shell: bash
      run: |
        mkdir -p test_ci_media
        touch "test_ci_media/Arrival (2016).mkv"
        if [ "$RUNNER_OS" = "Windows" ]; then
          ./dist/media-organizer.exe --help
          ./dist/media-organizer.exe config --list
          ./dist/media-organizer.exe --simulate --only-rename --bypass --path "test_ci_media"
        else
          chmod +x ./dist/media-organizer
          ./dist/media-organizer --help
          ./dist/media-organizer config --list
          ./dist/media-organizer --simulate --only-rename --bypass --path "test_ci_media"
        fi

  test-docker:
    name: Build & Test Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: media-organizer:test

      - name: Verify CLI & Bundled Dependencies (ffprobe, ffmpeg, gosu)
        run: |
          docker run --rm media-organizer:test ffprobe -version
          docker run --rm media-organizer:test ffmpeg -version
          docker run --rm media-organizer:test gosu --version
          docker run --rm media-organizer:test --help
          docker run --rm media-organizer:test config --list

      - name: Verify Docker Custom Config & 3-Volume Mount Simulation
        run: |
          mkdir -p /tmp/docker_test/config /tmp/docker_test/downloads /tmp/docker_test/movies /tmp/docker_test/tv
          chmod -R 777 /tmp/docker_test
          cat << 'EOF' > /tmp/docker_test/config/config.ini
          [paths]
          movies_folder = /data/Movies
          tv_shows_folder = /data/TV_Shows
          not_sorted_media_files_folder = /data/input

          [options]
          bypass = true
          resolution = false
          quality = false
          EOF

          touch "/tmp/docker_test/downloads/Arrival (2016).mkv"

          docker run --rm \
            -e PUID=1000 \
            -e PGID=1000 \
            -v /tmp/docker_test/config:/config \
            -v /tmp/docker_test/downloads:/data/input \
            -v /tmp/docker_test/movies:/data/Movies \
            -v /tmp/docker_test/tv:/data/TV_Shows \
            media-organizer:test --simulate --only-rename --bypass

      - name: Verify Out-of-the-Box 3-Volume Mount & Dual Logging
        run: |
          mkdir -p /tmp/docker_3vol/input /tmp/docker_3vol/movies /tmp/docker_3vol/tv /tmp/docker_3vol/logs
          chmod -R 777 /tmp/docker_3vol
          touch "/tmp/docker_3vol/input/Arrival (2016).mkv"

          docker run --rm \
            -e PUID=1000 \
            -e PGID=1000 \
            -e LOG=true \
            -v /tmp/docker_3vol/input:/data/input \
            -v /tmp/docker_3vol/movies:/data/Movies \
            -v /tmp/docker_3vol/tv:/data/TV_Shows \
            -v /tmp/docker_3vol/logs:/app/log \
            media-organizer:test --simulate --only-rename --bypass

          # Verify log file was created in /app/log mount
          test -n "$(ls -A /tmp/docker_3vol/logs)"

      - name: Verify Dynamic Volume Detection in Startup Diagnostics
        run: |
          mkdir -p /tmp/docker_diag/config /tmp/docker_diag/input /tmp/docker_diag/movies /tmp/docker_diag/tvshows
          chmod -R 777 /tmp/docker_diag
          cat << 'EOF' > /tmp/docker_diag/config/config.ini
          [paths]
          movies_folder = /data/CustomMovies
          tv_shows_folder = /data/TVShows
          not_sorted_media_files_folder = /data/CustomInput

          [options]
          bypass = true
          EOF

          # Run container with custom mounted paths and capture output
          CONTAINER_LOGS=$(docker run --rm \
            -e PUID=1000 \
            -e PGID=1000 \
            -v /tmp/docker_diag/config:/config \
            -v /tmp/docker_diag/input:/data/CustomInput \
            -v /tmp/docker_diag/movies:/data/CustomMovies \
            -v /tmp/docker_diag/tvshows:/data/TVShows \
            media-organizer:test --simulate --only-rename --bypass 2>&1 || true)

          echo "Container startup output:"
          echo "$CONTAINER_LOGS"

          # Assert that startup diagnostics dynamically detected the custom paths from config.ini
          echo "$CONTAINER_LOGS" | grep -q "Volumes:" || { echo "ERROR: Volumes header missing in logs"; exit 1; }
          echo "$CONTAINER_LOGS" | grep -q "/data/CustomInput .. \[OK: rw\]" || { echo "ERROR: /data/CustomInput not detected as OK: rw"; exit 1; }
          echo "$CONTAINER_LOGS" | grep -q "/data/CustomMovies .. \[OK: rw\]" || { echo "ERROR: /data/CustomMovies not detected as OK: rw"; exit 1; }
          echo "$CONTAINER_LOGS" | grep -q "/data/TVShows .. \[OK: rw\]" || { echo "ERROR: /data/TVShows not detected as OK: rw"; exit 1; }
          echo "$CONTAINER_LOGS" | grep -q "/config .. \[OK: rw\]" || { echo "ERROR: /config not detected as OK: rw"; exit 1; }

          # Verify that old hardcoded defaults are NOT reported
          if echo "$CONTAINER_LOGS" | grep -q "/data/TV_Shows .. \[Missing\]"; then
            echo "ERROR: Found hardcoded /data/TV_Shows in output!"; exit 1;
          fi
          if echo "$CONTAINER_LOGS" | grep -q "/data/Downloads .. \[Missing\]"; then
            echo "ERROR: Found hardcoded /data/Downloads in output!"; exit 1;
          fi
          echo "Dynamic volume detection test passed!"

  sonarqube:
    name: SonarQube Scan
    needs: [test, test-docker]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}