[project]
name = "media-organizer"
version = "2.0.1"
description = "Automated media renamer and organizer supporting Plex naming standards and multi-cloud AI"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = [
    "E501",  # Line length handled by formatter / relaxed for long error strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E741"]

